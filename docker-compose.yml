version: '3.8'

services:
  # Development workflow runner
  prefect-dev:
    build:
      context: .
    environment:
      - MATH_X=15
      - MATH_Y=8
      - PREFECT_API_URL=http://prefect-server:4200/api
    volumes:
      - .:/app
    depends_on:
      - prefect-server
    networks:
      - prefect-network

  # # Production workflow runner
  # prefect-workflow:
  #   build:
  #     context: .
  #     target: production
  #   environment:
  #     - MATH_X=20
  #     - MATH_Y=10
  #     - PREFECT_API_URL=http://prefect-server:4200/api
  #   depends_on:
  #     - prefect-server
  #   networks:
  #     - prefect-network
  #   restart: unless-stopped

  # Prefect server
  prefect-server:
    build:
      context: .
    ports:
      - "4200:4200"
    environment:
      - PREFECT_SERVER_API_HOST=0.0.0.0
      - PREFECT_SERVER_API_PORT=4200
      # - PREFECT_API_DATABASE_CONNECTION_URL=sqlite+aiosqlite:///./prefect.db
    # volumes:
    #   - prefect-data:/app/prefect.db
    networks:
      - prefect-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4200/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # # Prefect worker (optional - for scaled execution)
  # prefect-worker:
  #   build:
  #     context: .
  #     target: production
  #   environment:
  #     - PREFECT_API_URL=http://prefect-server:4200/api
  #   command: ["prefect", "worker", "start", "--pool", "default-agent-pool"]
  #   depends_on:
  #     - prefect-server
  #   networks:
  #     - prefect-network
  #   restart: unless-stopped
  #   deploy:
  #     replicas: 2

volumes:
  prefect-data:

networks:
  prefect-network:
    driver: bridge